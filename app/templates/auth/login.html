{% extends "base/base.html" %}

{% block title %}Sign in to your MedTrack account - MedTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card auth-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                    <i class="fas fa-lock fs-4"></i>
                </div>
                <span class="section-kicker">Welcome back</span>
                <h3 class="fw-bold">Sign in to your MedTrack account</h3>
                <p class="text-secondary small mb-0">Sign in securely to continue to your workspace.</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope text-secondary"></i></span>
                        <input type="email" class="form-control" name="email" value="{{ email or '' }}" required placeholder="name@example.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-key text-secondary"></i></span>
                        <input type="password" class="form-control" name="password" required placeholder="Enter your password">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label text-secondary small" for="remember">Remember me</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="fas fa-right-to-bracket me-2"></i>Sign In
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-secondary small mb-0">Don't have an account yet? <a href="{{ url_for('signup') }}" class="text-primary fw-semibold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
