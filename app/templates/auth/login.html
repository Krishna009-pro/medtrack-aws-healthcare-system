{% extends "base/base.html" %}

{% block title %}Sign In - MedTrack Telemetry Cloud{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="cyber-card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fas fa-heartbeat brand-icon-pulse fa-3x mb-3"></i>
                <h2 class="fw-bold mb-1">Welcome Back</h2>
                <p class="text-secondary small">Sign in to your MedTrack account</p>
            </div>

            <form method="POST" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label small fw-bold text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="physician@medtrack.com or patient@medtrack.com" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small fw-bold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label text-secondary small" for="remember">Keep session active</label>
                    </div>
                    <span class="badge-emerald small"><span class="pulse-dot"></span> TLS 1.3</span>
                </div>

                <button type="submit" class="btn-cyan-glow w-100 justify-content-center py-2 fs-6">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Authenticate &amp; Launch</span>
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                <p class="text-secondary small mb-0">
                    New to MedTrack? <a href="{{ url_for('auth.register') }}" class="text-cyan-gradient fw-bold text-decoration-none">Create an Account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
